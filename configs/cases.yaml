# Case studies for Project 3 (paper-faithful Cases 1-3 + extension Case 4).
# `positives` lists the abnormal classes that participate in the case (alongside No finding).
# `second_rotation_deg` follows the paper's per-case best-second-rotation: 90 for Case 1, 45 for the rest.
# All cases additionally use Rotation 270 + Shear (geometric transforms decided in plan).

cases:
  case_1:
    positives: [Disc space narrowing, Vertebral collapse]
    second_rotation_deg: 90
  case_2:
    positives: [Foraminal stenosis, Spondylolysthesis]
    second_rotation_deg: 45
  case_3:
    positives: [Osteophytes, Surgical implant]
    second_rotation_deg: 45
  case_4:
    positives: [Other lesions]
    second_rotation_deg: 45

# Decision D1: cap No-finding count in train at 1000 (paper's NF size). All abnormal positives kept.
no_finding_cap_train: 1000

# Decision D8: study-disjoint internal-val carve-out off the train pool, used as a second-look
# guardrail against test-set fitting. Test set is the official VinDr test, untouched.
internal_val_fraction: 0.10

# Reproducibility: a single seed drives both NF subsampling and internal-val splitting.
seed: 42

# ROI-patch pivot (current milestone). The classifier/WGAN operate on lesion crops, not whole
# images, because lesions occupy only 0.15%-3.1% of a full spine X-ray.
roi:
  margin: 0.20              # expand each bbox by 20% per side before cropping (lesion + small context)
  nf_patches_per_image: 1  # No-Finding patches emitted per NF image (matched-size, plan R3)
  store_size: 256          # patches saved on disk at this square resolution (downstream resizes from here)
  seed: 42                 # drives NF random-crop sampling

